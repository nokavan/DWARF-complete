name: Build mod packs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 (same version as the game)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1

      - name: Lua syntax check
        run: find mods -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Generated data is up to date
        run: |
          for g in mods/*/_gen/gen_data.py; do python3 "$g"; done
          git diff --exit-code -- mods

      - name: Game API check (names from CA's official scripting docs)
        run: python3 tools/check_api.py

      - name: Lua logic tests (stubbed game API)
        run: for t in tests/test_*.lua; do echo "== $t"; lua5.1 "$t"; done

      - name: Audit mods against original game data (private release "game-data")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view game-data >/dev/null 2>&1; then echo "no game-data release, audit skipped"; exit 0; fi
          pip install -q zstandard
          mkdir -p /tmp/game
          # only the zips (db.pack, local_*.pack); the release also holds multi-GB UI packs
          gh release download game-data -D /tmp/game --clobber -p '*.zip' || { echo "::error::download failed"; exit 1; }
          for z in /tmp/game/*.zip; do unzip -oq "$z" -d /tmp/game || echo "::warning::unzip failed: $z"; done
          ls -la /tmp/game
          DB=$(find /tmp/game -name db.pack | head -1)
          [ -n "$DB" ] || { echo "db.pack not found in game-data release"; exit 1; }
          curl -sSLf -o /tmp/schema_wh3.ron https://raw.githubusercontent.com/Frodo45127/rpfm-schemas/master/schema_wh3.ron
          python3 tools/audit_mods.py "$DB" /tmp/schema_wh3.ron > /tmp/audit.txt 2>&1; rc=$?
          cat /tmp/audit.txt
          if [ $rc -ne 0 ]; then echo "::error title=audit::$(tail -c 3000 /tmp/audit.txt | tr '\n' '|')"; exit $rc; fi

      - name: Build packs
        run: python3 tools/build_pack.py

      - uses: actions/upload-artifact@v4
        with:
          name: packs
          path: dist/*.pack

      - name: Publish "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/*.pack \
            --title "Последняя сборка (main)" \
            --notes "Автосборка из коммита ${GITHUB_SHA::7}. Нужный .pack положите в папку data игры и включите в лаунчере." \
            --target "$GITHUB_SHA" --prerelease

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.pack --title "$GITHUB_REF_NAME" --generate-notes
