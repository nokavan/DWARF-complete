name: Build mod packs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 (same version as the game)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1

      - name: Lua syntax check
        run: find mods -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Generated data is up to date
        run: |
          for g in mods/*/_gen/gen_data.py; do python3 "$g"; done
          git diff --exit-code -- mods

      - name: Game API check (names from CA's official scripting docs)
        run: python3 tools/check_api.py

      - name: Lua logic tests (stubbed game API)
        run: for t in tests/test_*.lua; do echo "== $t"; lua5.1 "$t"; done

      - name: Audit mods against original game data (private release "game-data")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view game-data >/dev/null 2>&1; then echo "no game-data release, audit skipped"; exit 0; fi
          pip install -q zstandard
          mkdir -p /tmp/game
          # only the zips (db.pack, local_*.pack); the release also holds multi-GB UI packs
          gh release download game-data -D /tmp/game --clobber -p '*.zip' || { echo "::error::download failed"; exit 1; }
          # python extraction: db.zip (Assembly Kit raw data) has a "/" entry that unzip rejects
          for z in /tmp/game/*.zip; do
            d=/tmp/game/$(basename "$z" .zip); mkdir -p "$d"
            python3 -I -c "import zipfile,sys,os; z=zipfile.ZipFile(sys.argv[1]); [z.extract(i, sys.argv[2]) for i in z.infolist() if i.filename.strip('/') and '..' not in i.filename]" "$z" "$d" || echo "::warning::extract failed: $z"
          done
          ls -la /tmp/game
          DB=$(find /tmp/game -name db.pack | head -1)
          [ -n "$DB" ] || { echo "db.pack not found in game-data release"; exit 1; }
          curl -sSLf -o /tmp/schema_wh3.ron https://raw.githubusercontent.com/Frodo45127/rpfm-schemas/master/schema_wh3.ron
          python3 tools/audit_mods.py "$DB" /tmp/schema_wh3.ron > /tmp/audit.txt 2>&1; rc=$?
          cat /tmp/audit.txt
          if [ $rc -ne 0 ]; then echo "::error title=audit::$(tail -c 3000 /tmp/audit.txt | tr '\n' '|')"; exit $rc; fi

      - name: Build packs
        run: python3 tools/build_pack.py

      - name: Iron Caravan for dwarfs (converted from the private source pack)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DB=$(find /tmp/game -name db.pack 2>/dev/null | head -1)
          if [ -z "$DB" ] || [ ! -f /tmp/schema_wh3.ron ]; then echo "no game data, skipped"; exit 0; fi
          gh release download game-data -D /tmp/game --clobber -p 'iron_caravan_draft.pack' \
            || { echo "::warning::iron_caravan_draft.pack is not in game-data, skipped"; exit 0; }
          python3 -I converters/iron_caravan_dwf/convert.py --src /tmp/game/iron_caravan_draft.pack \
            --game-db "$DB" --schema /tmp/schema_wh3.ron --out /tmp/conv/iron_caravan_dwf
          find /tmp/conv -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          python3 tools/audit_mods.py "$DB" /tmp/schema_wh3.ron /tmp/conv > /tmp/audit_conv.txt 2>&1; rc=$?
          cat /tmp/audit_conv.txt
          if [ $rc -ne 0 ]; then echo "::error title=audit iron_caravan_dwf::$(tail -c 3000 /tmp/audit_conv.txt | tr '\n' '|')"; exit $rc; fi
          python3 tools/build_pack.py --mods-root /tmp/conv --ron /tmp/schema_wh3.ron | tail -2
          # crash test pack: same tables, campaign scripts and script UI images removed (MIXER registration kept)
          T=/tmp/conv_test/iron_caravan_dwf_test_noscript
          mkdir -p /tmp/conv_test && cp -r /tmp/conv/iron_caravan_dwf "$T"
          rm -rf "$T/script/campaign/mod/iron_caravan_init.lua" "$T/ui/iron_caravan" "$T/ui/eventpics"
          # crash test pack 2: full scripts, caravan UI pictures removed
          T2=/tmp/conv_test2/iron_caravan_dwf_test_noimages
          mkdir -p /tmp/conv_test2 && cp -r /tmp/conv/iron_caravan_dwf "$T2"
          rm -rf "$T2/ui/iron_caravan" "$T2/ui/eventpics"
          python3 tools/build_pack.py --mods-root /tmp/conv_test --ron /tmp/schema_wh3.ron | tail -2
          python3 tools/build_pack.py --mods-root /tmp/conv_test2 --ron /tmp/schema_wh3.ron | tail -2
          # add-on for the ORIGINAL caravan (Chaos Dwarfs on Lost Slavers): dwarf units and heroes join it
          python3 -I converters/iron_caravan_dwarfs_addon/build.py --src /tmp/game/iron_caravan_draft.pack \
            --game-db "$DB" --schema /tmp/schema_wh3.ron --out /tmp/conv_addon/iron_caravan_dwarfs_addon
          find /tmp/conv_addon -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          python3 tools/audit_mods.py "$DB" /tmp/schema_wh3.ron /tmp/conv_addon || exit 1
          python3 tools/build_pack.py --mods-root /tmp/conv_addon --ron /tmp/schema_wh3.ron | tail -2
          # test variant: no dwarf military buildings in caravan slots
          A2=/tmp/conv_addon2/iron_caravan_dwarfs_addon_test_nochains
          mkdir -p /tmp/conv_addon2 && cp -r /tmp/conv_addon/iron_caravan_dwarfs_addon "$A2"
          rm -rf "$A2/db/slot_template_permitted_building_chains_tables" "$A2/db/building_chain_availability_sets_tables"
          python3 tools/build_pack.py --mods-root /tmp/conv_addon2 --ron /tmp/schema_wh3.ron | tail -2
          # test variants: tables only (no add-on script) / script only (no tables)
          A3=/tmp/conv_addon3/iron_caravan_dwarfs_addon_test_dbonly
          mkdir -p /tmp/conv_addon3 && cp -r "$A2" "$A3" && rm -rf "$A3/script"
          A4=/tmp/conv_addon3/iron_caravan_dwarfs_addon_test_scriptonly
          cp -r "$A2" "$A4" && rm -rf "$A4/db"
          # buildings only: dwarf military chains in caravan workshop slots (no units, heroes or script)
          A5=/tmp/conv_addon3/iron_caravan_dwarfs_addon_test_buildingsonly
          mkdir -p "$A5/db" && cp -r /tmp/conv_addon/iron_caravan_dwarfs_addon/db/slot_template_permitted_building_chains_tables \
            /tmp/conv_addon/iron_caravan_dwarfs_addon/db/building_chain_availability_sets_tables "$A5/db/"
          python3 tools/build_pack.py --mods-root /tmp/conv_addon3 --ron /tmp/schema_wh3.ron | tail -4
          rm -f /tmp/game/iron_caravan_draft.pack

      - name: Assembly Kit patch for the Hero Empire startpos
        run: |
          AK=$(find /tmp/game -path '*db/start_pos_factions.xml' -printf '%h\n' 2>/dev/null | head -1)
          if [ -z "$AK" ]; then echo "no Assembly Kit raw data in game-data, skipped"; exit 0; fi
          python3 -I mods/hero_empire/_gen/gen_ak_patch.py --ak "$AK" --out /tmp/ak_patch
          (cd /tmp/ak_patch && zip -qr "$GITHUB_WORKSPACE/dist/hero_empire_ak_patch.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: packs
          path: |
            dist/*.pack
            dist/*.zip

      - name: Publish "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          shopt -s nullglob; files=(dist/*.pack dist/*.zip)
          gh release create latest "${files[@]}" \
            --title "Последняя сборка (main)" \
            --notes "Автосборка из коммита ${GITHUB_SHA::7}. Нужный .pack положите в папку data игры и включите в лаунчере." \
            --target "$GITHUB_SHA" --prerelease

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.pack --title "$GITHUB_REF_NAME" --generate-notes
