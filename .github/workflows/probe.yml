name: probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          out=$( { gh release list -R Frodo45127/rpfm -L 5; gh release view -R Frodo45127/rpfm --json tagName,assets -q '.tagName, (.assets[] | .name)'; } 2>&1 | tr '\n' '|')
          echo "::notice title=probe::$out"
